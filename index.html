<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贪吃蛇 · 栗子游戏网</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#0b0e0c; color:#7a8a7e; font-family:"Microsoft YaHei","PingFang SC",sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap { width:100vw; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  #back { position:fixed; top:14px; left:18px; color:#7a8a7e; font-size:13px; text-decoration:none; letter-spacing:1px; }
  #back:hover { color:#c7f0d8; }
  #phone { position:relative; padding:22px 22px 30px; background:linear-gradient(160deg,#3a423c,#1f2421); border-radius:30px; box-shadow:0 0 0 2px #121513, 0 18px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08); }
  #screen { position:relative; padding:6px; background:#26302a; border-radius:8px; box-shadow:inset 0 2px 6px rgba(0,0,0,.6); }
  #game { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  #screen::after { content:""; position:absolute; inset:6px; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),
               repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0 1px, transparent 1px 3px); }
  #brand { position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:11px; letter-spacing:6px; color:#8d978f; font-weight:700; }
  #hint { font-size:12px; color:#6d7a70; letter-spacing:1px; text-align:center; line-height:1.8; }
  kbd { display:inline-block; padding:0 4px; border:1px solid #3c463f; color:#b6c4b9; font-family:monospace; }
</style>
</head>
<body>
<a id="back" href="../">◀ 返回栗子游戏网</a>
<div id="wrap">
  <div id="phone">
    <div id="screen"><canvas id="game" width="216" height="156"></canvas></div>
    <div id="brand">LIZI</div>
  </div>
  <div id="hint"><kbd>方向键</kbd>/<kbd>WASD</kbd> 转向　<kbd>Enter</kbd> 确定　<kbd>P</kbd>/<kbd>空格</kbd> 暂停　<kbd>Esc</kbd> 菜单　<kbd>M</kbd> 静音<br>手机：滑动转向，轻点确定 / 暂停</div>
</div>
<script>
(() => {
  "use strict";
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  const CELL = 8, COLS = 26, ROWS = 17;
  const FX = 4, FY = 16, FW = COLS * CELL, FH = ROWS * CELL;
  const W = 216, H = 156;
  const BG = "#c7f0d8", INK = "#43523d", GHOST = "rgba(199,240,216,0.5)";
  const DIRS = [{x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}];
  const LEVELS = ["SLOW", "NORMAL", "FAST"];
  const MODES = ["CLASSIC", "WRAP"];
  const BASE_MS = [160, 110, 75];
  const FOOD_PTS = [5, 8, 12];

  function fit(){
    const s = Math.min((window.innerWidth - 70) / W, (window.innerHeight - 190) / H);
    const k = s >= 1 ? Math.floor(s) : Math.max(s, 0.5);
    cv.style.width = (W * k) + "px";
    cv.style.height = (H * k) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  // ---------- 字体 ----------
  const FONT_SRC = {
    A:"01110 10001 10001 11111 10001 10001 10001", B:"11110 10001 10001 11110 10001 10001 11110",
    C:"01110 10001 10000 10000 10000 10001 01110", D:"11110 10001 10001 10001 10001 10001 11110",
    E:"11111 10000 10000 11110 10000 10000 11111", F:"11111 10000 10000 11110 10000 10000 10000",
    G:"01110 10001 10000 10111 10001 10001 01111", H:"10001 10001 10001 11111 10001 10001 10001",
    I:"01110 00100 00100 00100 00100 00100 01110", J:"00111 00010 00010 00010 00010 10010 01100",
    K:"10001 10010 10100 11000 10100 10010 10001", L:"10000 10000 10000 10000 10000 10000 11111",
    M:"10001 11011 10101 10101 10001 10001 10001", N:"10001 10001 11001 10101 10011 10001 10001",
    O:"01110 10001 10001 10001 10001 10001 01110", P:"11110 10001 10001 11110 10000 10000 10000",
    Q:"01110 10001 10001 10001 10101 10010 01101", R:"11110 10001 10001 11110 10100 10010 10001",
    S:"01111 10000 10000 01110 00001 00001 11110", T:"11111 00100 00100 00100 00100 00100 00100",
    U:"10001 10001 10001 10001 10001 10001 01110", V:"10001 10001 10001 10001 10001 01010 00100",
    W:"10001 10001 10001 10101 10101 10101 01010", X:"10001 10001 01010 00100 01010 10001 10001",
    Y:"10001 10001 01010 00100 00100 00100 00100", Z:"11111 00001 00010 00100 01000 10000 11111",
    "0":"01110 10001 10011 10101 11001 10001 01110", "1":"00100 01100 00100 00100 00100 00100 01110",
    "2":"01110 10001 00001 00010 00100 01000 11111", "3":"11111 00010 00100 00010 00001 10001 01110",
    "4":"00010 00110 01010 10010 11111 00010 00010", "5":"11111 10000 11110 00001 00001 10001 01110",
    "6":"00110 01000 10000 11110 10001 10001 01110", "7":"11111 00001 00010 00100 01000 01000 01000",
    "8":"01110 10001 10001 01110 10001 10001 01110", "9":"01110 10001 10001 01111 00001 00010 01100",
    "<":"00010 00100 01000 10000 01000 00100 00010", ">":"01000 00100 00010 00001 00010 00100 01000",
    ":":"00000 01100 01100 00000 01100 01100 00000", "!":"00100 00100 00100 00100 00100 00000 00100",
    "-":"00000 00000 00000 11111 00000 00000 00000"
  };
  const FONT = {};
  for (const k in FONT_SRC) FONT[k] = FONT_SRC[k].split(" ");
  function text(str, x, y, color, scale){
    scale = scale || 1;
    ctx.fillStyle = color;
    str = String(str);
    for (let i = 0; i < str.length; i++) {
      const g = FONT[str[i]];
      if (!g) continue;
      for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++)
        if (g[r][c] === "1") ctx.fillRect(x + (i * 6 + c) * scale, y + r * scale, scale, scale);
    }
  }
  function textW(str, scale){ return (String(str).length * 6 - 1) * (scale || 1); }
  function center(str, y, color, scale){ text(str, (W - textW(str, scale)) >> 1, y, color, scale); }
  function pad4(n){ return String(n).padStart(4, "0"); }

  const BONUS_SPR = [
    "..11......11....",
    ".1111....1111...",
    ".11111111111111.",
    "111.111111.1111.",
    "1111111111111111",
    ".11111111111111.",
    "..111111111111..",
    "...1.1....1.1..."
  ];
  function sprite(rows, x, y){
    ctx.fillStyle = INK;
    for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++)
      if (rows[r][c] === "1") ctx.fillRect(x + c, y + r, 1, 1);
  }

  // ---------- 声音 ----------
  let ac = null, muted = false;
  function initAudio(){
    if (ac) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  function tone(freq, dur, vol, delay, type){
    if (!ac || muted) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const SFX = {
    eat:   () => tone(1320, 0.05, 0.05),
    bonus: () => { tone(1046, 0.06, 0.05); tone(1568, 0.08, 0.05, 0.07); },
    big:   () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.07, 0.05, i * 0.06)),
    die:   () => [440, 330, 247, 165].forEach((f, i) => tone(f, 0.14, 0.07, i * 0.13, "triangle")),
    move:  () => tone(1800, 0.02, 0.02),
    pause: () => tone(660, 0.08, 0.04)
  };
  function sfx(n){ if (SFX[n]) SFX[n](); }

  // ---------- 状态 ----------
  let state = "menu", menuSel = 0, mode = 0, lvl = 1;
  let snake = [], dir = 1, dirQueue = [], grow = 0, food = null, bonus = null;
  let score = 0, eaten = 0, acc = 0, dieT = 0, newTop = false, tick = 0;

  function hiKey(){ return "lizi_snake_hi_" + mode + "_" + lvl; }
  function getHi(){ return Number(localStorage.getItem(hiKey()) || 0); }
  function stepMs(){ const b = BASE_MS[lvl]; return Math.max(b * 0.6, b - eaten * 1.5); }

  function occupied(x, y){
    for (const s of snake) if (s.x === x && s.y === y) return true;
    if (bonus && y === bonus.y && (x === bonus.x || x === bonus.x + 1)) return true;
    return false;
  }
  function placeFood(){
    const free = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!occupied(x, y)) free.push({x, y});
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }
  function placeBonus(){
    const free = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS - 1; x++) {
      if (occupied(x, y) || occupied(x + 1, y)) continue;
      if (food && food.y === y && (food.x === x || food.x === x + 1)) continue;
      free.push({x, y});
    }
    if (!free.length) return;
    const p = free[(Math.random() * free.length) | 0];
    bonus = { x:p.x, y:p.y, left:40 };
    sfx("bonus");
  }

  function startGame(){
    snake = [];
    for (let i = 0; i < 5; i++) snake.push({ x:8 - i, y:8 });
    dir = 1; dirQueue = []; grow = 0; bonus = null;
    score = 0; eaten = 0; acc = 0; newTop = false;
    placeFood();
    state = "play";
  }
  function queueDir(d){
    if (state !== "play") return;
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (d === last || (d + 2) % 4 === last) return;
    if (dirQueue.length < 2) dirQueue.push(d);
  }
  function die(){
    state = "dying"; dieT = 0;
    const hi = getHi();
    if (score > hi) { localStorage.setItem(hiKey(), String(score)); newTop = score > 0; }
    sfx("die");
  }
  function step(){
    if (dirQueue.length) dir = dirQueue.shift();
    const d = DIRS[dir], h = snake[0];
    let nx = h.x + d.x, ny = h.y + d.y;
    if (mode === 1) { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
    else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { die(); return; }
    const tailMoves = grow === 0;
    for (let i = 0; i < snake.length - (tailMoves ? 1 : 0); i++)
      if (snake[i].x === nx && snake[i].y === ny) { die(); return; }
    snake.unshift({ x:nx, y:ny });
    if (grow > 0) grow--; else snake.pop();

    if (food && nx === food.x && ny === food.y) {
      grow++; eaten++;
      score += FOOD_PTS[lvl];
      sfx("eat");
      placeFood();
      if (!food && !bonus) { die(); return; }
      if (eaten % 5 === 0 && !bonus) placeBonus();
    }
    if (bonus) {
      if (ny === bonus.y && (nx === bonus.x || nx === bonus.x + 1)) {
        score += 20 + bonus.left * 2;
        grow += 2;
        bonus = null;
        sfx("big");
      } else if (--bonus.left <= 0) bonus = null;
    }
  }

  // ---------- 绘制 ----------
  function cellX(x){ return FX + x * CELL; }
  function cellY(y){ return FY + y * CELL; }
  function adjacent(a, b){
    const dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) + Math.abs(dy) === 1) return { x:dx, y:dy };
    if (mode === 1) {
      if (Math.abs(dx) === COLS - 1 && dy === 0) return { x:-Math.sign(dx), y:0 };
      if (Math.abs(dy) === ROWS - 1 && dx === 0) return { x:0, y:-Math.sign(dy) };
    }
    return null;
  }
  function drawSnake(){
    ctx.fillStyle = INK;
    for (let i = 0; i < snake.length; i++) {
      const s = snake[i], px = cellX(s.x), py = cellY(s.y);
      ctx.fillRect(px + 1, py + 1, 6, 6);
      const n = snake[i + 1] && adjacent(s, snake[i + 1]);
      if (n) {
        if (n.x === 1) ctx.fillRect(px + 7, py + 1, 2, 6);
        if (n.x === -1) ctx.fillRect(px - 1, py + 1, 2, 6);
        if (n.y === 1) ctx.fillRect(px + 1, py + 7, 6, 2);
        if (n.y === -1) ctx.fillRect(px + 1, py - 1, 6, 2);
      }
    }
    const h = snake[0];
    if (!h) return;
    const px = cellX(h.x), py = cellY(h.y), d = DIRS[dir];
    ctx.fillStyle = BG;
    const ex = d.x === 1 ? 5 : d.x === -1 ? 2 : (d.y === -1 ? 2 : 5);
    const ey = d.y === 1 ? 5 : d.y === -1 ? 2 : (d.x === 1 ? 2 : 5);
    ctx.fillRect(px + ex, py + ey, 1, 1);
    if ((tick >> 4) & 1) {
      ctx.fillStyle = INK;
      if (d.x) ctx.fillRect(d.x > 0 ? px + 7 : px - 1, py + 3, 2, 1);
      else ctx.fillRect(px + 3, d.y > 0 ? py + 7 : py - 1, 1, 2);
    }
  }
  function drawFood(){
    if (!food) return;
    const px = cellX(food.x), py = cellY(food.y);
    ctx.fillStyle = INK;
    ctx.fillRect(px + 3, py + 2, 2, 4);
    ctx.fillRect(px + 2, py + 3, 4, 2);
  }
  function drawField(){
    ctx.fillStyle = INK;
    ctx.fillRect(0, 12, W, 1);
    ctx.fillRect(FX - 2, FY - 2, FW + 4, 1);
    ctx.fillRect(FX - 2, FY + FH + 1, FW + 4, 1);
    ctx.fillRect(FX - 2, FY - 2, 1, FH + 4);
    ctx.fillRect(FX + FW + 1, FY - 2, 1, FH + 4);
    if (mode === 1) {
      ctx.fillStyle = GHOST;
      for (let x = FX; x < FX + FW; x += 4) { ctx.fillRect(x, FY - 2, 2, 1); ctx.fillRect(x, FY + FH + 1, 2, 1); }
      for (let y = FY; y < FY + FH; y += 4) { ctx.fillRect(FX - 2, y, 1, 2); ctx.fillRect(FX + FW + 1, y, 1, 2); }
    }
    text(pad4(score), 4, 3, INK);
    if (bonus) {
      sprite(BONUS_SPR, W - 44, 2);
      const t = String(bonus.left).padStart(2, "0");
      text(t, W - 4 - textW(t), 3, INK);
    } else {
      const m = MODES[mode] + " " + LEVELS[lvl];
      text(m, W - 4 - textW(m), 3, INK);
    }
  }
  function drawPlay(showSnake){
    drawField();
    drawFood();
    if (bonus && ((bonus.left > 10) || ((tick >> 3) & 1))) sprite(BONUS_SPR, cellX(bonus.x), cellY(bonus.y));
    if (showSnake) drawSnake();
  }
  function box(x, y, w, h){
    ctx.fillStyle = BG; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = INK;
    ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
    ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
  }
  function drawMenu(){
    center("SNAKE", 14, INK, 3);
    const t = tick >> 3;
    ctx.fillStyle = INK;
    for (let i = 0; i < 9; i++) {
      const x = 60 + ((t + i) % 12) * 8 - 8;
      if (i < 8) ctx.fillRect(x + 1, 41, 6, 4);
      if (i < 7) ctx.fillRect(x + 7, 42, 2, 2);
    }
    const items = [
      "START GAME",
      "MODE: " + MODES[mode],
      "LEVEL: " + LEVELS[lvl],
      "TOP: " + pad4(getHi())
    ];
    for (let i = 0; i < items.length; i++) {
      const y = 58 + i * 16;
      let s = items[i];
      if (i === menuSel && (i === 1 || i === 2)) s = "< " + s + " >";
      if (i === menuSel) {
        ctx.fillStyle = INK; ctx.fillRect(28, y - 3, W - 56, 13);
        center(s, y, BG);
      } else center(s, y, INK);
    }
    if ((tick >> 5) & 1) center("PRESS ENTER", 134, INK);
  }
  function drawOver(){
    box(36, 34, 144, 88);
    center("GAME OVER", 42, INK);
    ctx.fillStyle = INK; ctx.fillRect(52, 53, 112, 1);
    center("SCORE " + pad4(score), 60, INK);
    center("TOP   " + pad4(getHi()), 72, INK);
    if (newTop && ((tick >> 4) & 1)) center("NEW TOP!", 84, INK);
    center("ENTER  AGAIN", 98, INK);
    center("ESC  MENU", 108, INK);
  }
  function draw(){
    ctx.fillStyle = GHOST;
    ctx.fillRect(0, 0, W, H);
    if (state === "menu") drawMenu();
    else if (state === "play") drawPlay(true);
    else if (state === "pause") {
      drawPlay(true);
      ctx.fillStyle = INK; ctx.fillRect(64, 62, 88, 22);
      center("PAUSED", 70, BG);
    }
    else if (state === "dying") drawPlay(((dieT / 150) | 0) % 2 === 0);
    else if (state === "over") { drawPlay(true); drawOver(); }
  }

  // ---------- 循环 ----------
  let last = performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    const dt = Math.min(100, now - last);
    last = now;
    tick++;
    if (state === "play") {
      acc += dt;
      let guard = 0;
      while (acc >= stepMs() && state === "play" && guard++ < 4) { acc -= stepMs(); step(); }
    } else if (state === "dying") {
      dieT += dt;
      if (dieT > 1200) state = "over";
    }
    draw();
  }

  // ---------- 输入 ----------
  function pauseToggle(){
    if (state === "play") { state = "pause"; sfx("pause"); }
    else if (state === "pause") { state = "play"; acc = 0; }
  }
  function menuMove(d){
    if (d === 0) { menuSel = (menuSel + 3) % 4; sfx("move"); }
    else if (d === 2) { menuSel = (menuSel + 1) % 4; sfx("move"); }
    else if (menuSel === 1) { mode = 1 - mode; sfx("move"); }
    else if (menuSel === 2) { lvl = (lvl + (d === 1 ? 1 : 2)) % 3; sfx("move"); }
  }
  function confirm(){
    if (state === "menu") {
      if (menuSel === 0 || menuSel === 3) startGame();
      else menuMove(1);
    } else if (state === "over") startGame();
    else if (state === "play" || state === "pause") pauseToggle();
  }
  function onDir(d){
    if (state === "menu") menuMove(d);
    else if (state === "play") queueDir(d);
  }
  const KEYDIR = { ArrowUp:0, KeyW:0, ArrowRight:1, KeyD:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3 };
  window.addEventListener("keydown", e => {
    initAudio();
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (e.code in KEYDIR) { onDir(KEYDIR[e.code]); return; }
    if (e.repeat) return;
    if (e.code === "Enter" || e.code === "NumpadEnter") confirm();
    else if (e.code === "Space" || e.code === "KeyP") { if (state === "menu" || state === "over") confirm(); else pauseToggle(); }
    else if (e.code === "Escape") { if (state === "play") pauseToggle(); else if (state !== "menu") state = "menu"; }
    else if (e.code === "KeyM") muted = !muted;
  });
  let touch = null;
  window.addEventListener("touchstart", e => {
    initAudio();
    const t = e.changedTouches[0];
    touch = { x:t.clientX, y:t.clientY };
  }, { passive:true });
  window.addEventListener("touchend", e => {
    if (!touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    touch = null;
    if (e.target.id === "back") return;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { confirm(); return; }
    onDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") pauseToggle(); });

  // ---------- 测试接口 ----------
  const DNAME = { up:0, right:1, down:2, left:3 };
  window.__snake = {
    start(m, l){ if (m !== undefined) mode = m === "wrap" || m === 1 ? 1 : 0; if (l !== undefined) lvl = Math.max(0, Math.min(2, l)); startGame(); },
    snapshot(){
      return { state, mode:MODES[mode], level:LEVELS[lvl], length:snake.length, score,
        head:snake[0] ? { ...snake[0] } : null, dir, food:food ? { ...food } : null, bonus:!!bonus };
    },
    step(n){ n = n || 1; for (let i = 0; i < n && state === "play"; i++) step(); return this.snapshot(); },
    turn(d){ queueDir(typeof d === "string" ? DNAME[d] : d); },
    food(x, y){ food = { x, y }; },
    testWall(){
      this.start("classic");
      snake = [{x:COLS - 1, y:8}, {x:COLS - 2, y:8}, {x:COLS - 3, y:8}];
      dir = 1; dirQueue = []; food = { x:0, y:0 }; bonus = null;
      step();
      return { died:state === "dying", state };
    },
    testWrap(){
      this.start("wrap");
      snake = [{x:COLS - 1, y:8}, {x:COLS - 2, y:8}, {x:COLS - 3, y:8}];
      dir = 1; dirQueue = []; food = { x:0, y:0 }; bonus = null;
      step();
      return { died:state === "dying", head:{ ...snake[0] } };
    },
    testSelf(){
      this.start("classic");
      snake = [{x:5, y:5}, {x:6, y:5}, {x:6, y:6}, {x:5, y:6}, {x:4, y:6}, {x:4, y:5}, {x:4, y:4}];
      dir = 2; dirQueue = []; food = { x:20, y:15 }; bonus = null;
      step();
      return { died:state === "dying", state };
    },
    testEat(){
      this.start("classic");
      const before = snake.length, h = snake[0];
      food = { x:h.x + 1, y:h.y };
      step(); step();
      return { lengthBefore:before, lengthAfter:snake.length, score };
    }
  };

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
})();
</script>
